<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕测试</title>
  <style>
    @font-face {
      font-family: "Pelican Serif";
      src: url("/public/fonts/PelicanSerif-SemiBold.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Pelican Sans";
      src: url("/public/fonts/PelicanSans-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Pelican Sans";
      src: url("/public/fonts/PelicanSans-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Noto Sans Mono";
      src: url("/public/fonts/NotoSansMono-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Press Start 2P";
      src: url("/public/fonts/PressStart2P-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    html, body { margin: 0; height: 100%; background: #100e0c; color: #f4efe6; }
    body {
      font-family: "Pelican Sans", "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
    }
    #stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: min(100vw, calc((100vh - 72px) * 16 / 9));
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    #stage canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    #gl { z-index: 1; }
    #text { z-index: 2; pointer-events: none; background: transparent; }
    #bar {
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      background: #1b1612;
      border-top: 1px solid #3a2e22;
    }
    #play {
      font: 600 16px/1 "Pelican Sans", sans-serif;
      color: #1b1612;
      background: #f3ead7;
      border: 0;
      border-radius: 4px;
      padding: 10px 16px;
      cursor: pointer;
    }
    #seek { flex: 1 1 auto; accent-color: #e0a15a; }
    #section {
      min-width: 280px;
      font: 600 18px/1.3 "Pelican Serif", serif;
      text-align: right;
    }
    #clock {
      font: 400 16px/1 "Noto Sans Mono", ui-monospace, monospace;
      color: #d9cbb6;
      width: 72px;
    }
    body.export { width: 1920px; height: 1080px; overflow: hidden; display: block; }
    body.export #bar { display: none; }
    body.export #stage { width: 1920px; height: 1080px; margin: 0; }
    body.export #stage canvas {
      width: 1920px !important;
      height: 1080px !important;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="text" width="1920" height="1080"></canvas>
  </div>
  <div id="bar">
    <button id="play" type="button">播放</button>
    <input id="seek" type="range" min="0" max="137" step="0.001" value="0" aria-label="进度">
    <span id="section">序幕</span>
    <span id="clock">0:00.0</span>
  </div>
  <script src="/public/vendor/p5.min.js"></script>
  <script src="/public/vendor/p5.brush.js"></script>
  <script type="module" src="/src/main/preview.js"></script>
</body>
</html>
